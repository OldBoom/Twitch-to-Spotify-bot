[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-music-bot"
version = "0.1.0"
description = "Twitch song-request bot that appends tracks to a Spotify Premium queue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "twitchio>=3.3.0,<4",
    "httpx>=0.27.0,<1",
    "pydantic-settings>=2.4.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
    "pyinstaller>=6.0,<7",
]

[project.scripts]
spotify-music-bot = "main:main"
spotify-music-bot-ui = "control_app:main"
spotify-auth = "spotify.auth:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
